# Example dashboard card config for Home 3D Card.
# Copy into a dashboard (Edit → raw config), or use the visual editor instead.

type: custom:home-3d-card
model: /local/home.glb            # your exported GLB in config/www/

# Appearance
default_glow_color: "#ffd27f"     # warm glow for lights without their own colour
default_size: 1                   # marker size multiplier (1 = auto, scaled to model)
background: "#0d1016"
ambient_intensity: 0.9

# Starting camera (omit to auto-fit to the model). Use "Save view" in the editor.
# Values are in the model's own units (centimetres for a Sweet Home 3D export).
# camera:
#   position: [600, 500, 600]
#   target: [0, 100, 0]

# Light markers. Easiest to place these with the visual editor, but you can
# hand-edit too. position is [x, y, z] in the model's coordinate space (cm).
lights:
  - entity: light.kitchen
    position: [120, 240, -80]
  - entity: light.living_room
    position: [-210, 240, 150]
    color: "#aee1ff"             # per-light override
    size: 1.5                    # 1.5× the default marker size
  - entity: light.bedroom
    position: [340, 240, 210]

# Fans: a model object spins when the fan entity is on; speed follows the fan's
# percentage (e.g. 33/66/100 → slow/medium/fast). Easiest to add via the editor
# (🌀 Add fan, then click the fan in the model). `object` is the GLB node name.
fans:
  - entity: fan.office_switch
    object: Ceiling_lamp_034_2141   # the node clicked in the editor
    position: [120, 250, -80]       # click the hub — this sets the spin axis
    light: light.office             # optional: fan's light kit (glows + popup)
    # reverse: true                 # spin the other way if needed
# fan_min_speed: 1.5                 # rad/s at lowest percentage
# fan_max_speed: 11                  # rad/s at 100%

# Visual polish (all optional; sensible defaults shown)
# shadows: true            # soft shadows from a fitted directional light
# exposure: 1.0            # ACES tone-mapping exposure (raise to brighten)
# match_bulb_color: true   # light glow follows the bulb's real rgb_color when on

# Non-light device markers: switch / cover / climate / sensor / binary_sensor /
# lock / media_player. Tap = domain action (toggle, or more-info for climate &
# sensors). Sensor & climate markers show a floating value label. Add them with
# the editor's "📟 Add device" button, or hand-edit like the lights above:
devices:
  - entity: sensor.living_room_temperature
    position: [0, 240, 0]
  - entity: switch.porch
    position: [200, 240, 300]
  - entity: cover.garage_door
    position: [-300, 200, 0]
    label: false             # hide the value label for this marker

# Live energy HUD (panel only, top-left). Wire any of these entity keys; each
# one present adds a row (Solar / House / Battery / Grid). Omit `energy` for none.
energy:
  solar_power: sensor.goodwe_pv_power
  load_power: sensor.goodwe_house_consumption
  battery_soc: sensor.goodwe_battery_state_of_charge
  battery_power: sensor.goodwe_battery_power
  grid_import: sensor.grid_import_power
  grid_export: sensor.grid_export_power

# If your dashboards are viewed offline, self-host three.js and set:
# three_cdn: /local/three
